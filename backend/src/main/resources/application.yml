server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Behind CloudFront + Traefik: honour X-Forwarded-* so generated links use the public scheme.
  forward-headers-strategy: framework

spring:
  application:
    name: generative-ai-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # OpenAI chat is not used; text generation runs on Anthropic instead.
  autoconfigure:
    exclude: org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}
    openai:
      api-key: ${OPENAI_API_KEY}
      image:
        options:
          model: ${OPENAI_IMAGE_MODEL:dall-e-3}
          size: ${OPENAI_IMAGE_SIZE:1024x1024}
      audio:
        speech:
          options:
            model: ${OPENAI_TTS_MODEL:tts-1}
            voice: ${OPENAI_TTS_VOICE:alloy}
            response-format: mp3

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5001}
  generation:
    max-prompt-length: ${MAX_PROMPT_LENGTH:2000}
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./generated-media}
  video:
    provider-url: ${VIDEO_PROVIDER_URL:}
    provider-api-key: ${VIDEO_PROVIDER_API_KEY:}
    timeout-seconds: ${VIDEO_PROVIDER_TIMEOUT_SECONDS:60}

resilience4j:
  ratelimiter:
    instances:
      generation:
        limit-for-period: ${GENERATION_RATE_LIMIT:10}
        limit-refresh-period: 1m
        timeout-duration: 0s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes.
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.genai.backend: INFO
    org.springframework.ai: WARN
