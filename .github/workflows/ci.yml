name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"
      - name: Build
        run: npm run build
        env:
          CI: "true"
          REACT_APP_API_BASE_URL: ""

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Lint & render charts
        run: |
          for c in genai-backend genai-frontend; do
            for mode in "" "--set ingress.host=1-2-3-4.sslip.io --set ingress.tls=true"; do
              # shellcheck disable=SC2086
              helm lint deploy/helm/$c --set image.repository=x --set image.tag=y $mode
              # shellcheck disable=SC2086
              helm template t deploy/helm/$c --set image.repository=x --set image.tag=y $mode >> rendered.yaml
              echo "---" >> rendered.yaml
            done
          done
      - name: Validate manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml
      - name: Shellcheck deploy script
        run: shellcheck deploy/remote-deploy.sh scripts/*.sh
