apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genai-backend.fullname" . }}-test-health
  labels: {{- include "genai-backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      args: ["-fsS", "--retry", "5", "--retry-connrefused", "http://{{ include "genai-backend.fullname" . }}/actuator/health/readiness"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          memory: 32Mi
