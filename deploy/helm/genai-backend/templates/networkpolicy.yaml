{{- if .Values.networkPolicy.enabled }}
# Only Traefik (kube-system) and same-namespace pods (helm test) may reach the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "genai-backend.fullname" . }}
  labels: {{- include "genai-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "genai-backend.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
      ports:
        - port: http
{{- end }}
