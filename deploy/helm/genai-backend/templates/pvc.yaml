{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "genai-backend.fullname" . }}-media
  labels: {{- include "genai-backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete generated media on uninstall
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
